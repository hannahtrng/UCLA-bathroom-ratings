<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UCLA Bathroom Ratings Map</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="header">
            <h1>UCLA Bathroom Ratings - Thermal Map</h1>
            <p>Heat map showing bathroom quality ratings across campus</p>
        </div>
        <div id="map"></div>
        <div id="loading">Loading bathroom data...</div>
        <div id="closest-sidebar">
            <div id="closest-list">
                <p>Click "Find Nearest" to see nearby bathrooms</p>
            </div>
        </div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
        <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
        <script src="app.js"></script>
    </body>
</html>
